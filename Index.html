<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Plant Disease Detector</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>🌱 Plant Disease Detector</h1>

    <p>
        Select your plant and the symptom you see on its leaves.
    </p>

    <form action="/detect" method="POST">

        <label>Plant Name</label>

        <select name="plant" required>
            <option value="">Select Plant</option>
            <option>Tomato</option>
            <option>Potato</option>
            <option>Corn</option>
            <option>Rice</option>
            <option>Eggplant</option>
        </select>


        <label>Plant Symptom</label>

        <select name="symptom" required>

            <option value="">
                Select Symptom
            </option>

            <option value="brown_spots">
                Brown / Black Spots
            </option>

            <option value="yellow_leaves">
                Yellow Leaves
            </option>

            <option value="white_powder">
                White Powder on Leaves
            </option>

            <option value="wilting">
                Wilting Plant
            </option>

            <option value="healthy">
                No Visible Problem
            </option>

        </select>

        <button type="submit">
            🔍 Detect Disease
        </button>

    </form>

</div>

</body>
</html>
